name: Build and release description packages

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-build.lock.txt
      - name: Native CAD and SVG dependencies
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libcairo2 libegl1
      - name: Install locked build environment
        run: python -m pip install -r requirements-build.lock.txt
      - name: Portable reference regression tests
        run: python -I -m pytest tests -q -p no:cacheprovider
      - name: Full independent build and validation
        run: python -I tools/build.py
      - name: Save portability diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-portability-diagnostics
          path: |
            mujoco/par6/assets/branding
            mujoco/par6/par6_flange.xml
            source/reviews/render_cache/par6_flange.json
            reports/appearance/side_badge_geometry.json
      - name: Prepare checked release assets
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python -I tools/prepare_release.py --tag "$GITHUB_REF_NAME"
          else
            python -I tools/prepare_release.py
          fi
      - name: Save model packages
        uses: actions/upload-artifact@v7
        with:
          name: robot-description-packages
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  ros2:
    name: ROS 2 ${{ matrix.distro }} install and display
    runs-on: ubuntu-24.04
    container: ros:${{ matrix.distro }}-ros-base
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    env:
      ROS_LOCALHOST_ONLY: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      QT_X11_NO_MITSHM: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install ROS display and validation dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions liburdfdom-tools xvfb xauth \
            libgl1-mesa-dri python3-pyqt5 python3-pil \
            ros-${ROS_DISTRO}-launch-ros ros-${ROS_DISTRO}-rviz2 \
            ros-${ROS_DISTRO}-joint-state-publisher-gui
      - name: Build the description and MoveIt packages and relocate the install
        shell: bash
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          task_ws=${RUNNER_TEMP}/description_ros2_ws
          mkdir -p "${task_ws}/src"
          colcon list --names-only --base-paths "${GITHUB_WORKSPACE}" > "${task_ws}/packages.txt"
          python3 -c 'import pathlib,sys; assert set(pathlib.Path(sys.argv[1]).read_text().split()) == {"par6_description","parol6_description","msg_description","ssg48_description","raft_description","par6_moveit_config","parol6_moveit_config"}' "${task_ws}/packages.txt"
          cp -a urdf/. "${task_ws}/src/"
          cd "${task_ws}"
          colcon build --merge-install --event-handlers console_cohesion+
          mv src source_hidden
          mv build build_hidden
          mv install relocated_install
      - name: Validate installed variants, TF, mimic joints and GUI applications
        shell: bash
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source ${RUNNER_TEMP}/description_ros2_ws/relocated_install/setup.bash
          xvfb-run -a -s '-screen 0 1600x1000x24' \
            python3 tools/ros_support/validate_ros2.py --output reports/integration/ros2/${ROS_DISTRO}
      - name: Save ROS display checks and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ros2-${{ matrix.distro }}-validation
          path: reports/integration/ros2/${{ matrix.distro }}/
          if-no-files-found: warn

  moveit2:
    name: MoveIt 2 ${{ matrix.distro }} planning and mock execution
    runs-on: ubuntu-24.04
    container: ros:${{ matrix.distro }}-ros-base
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    env:
      ROS_LOCALHOST_ONLY: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      QT_X11_NO_MITSHM: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install MoveIt and mock controller dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-pyqt5 python3-yaml \
            xvfb xauth libgl1-mesa-dri ros-${ROS_DISTRO}-moveit \
            ros-${ROS_DISTRO}-ros2-control ros-${ROS_DISTRO}-ros2-controllers \
            ros-${ROS_DISTRO}-joint-state-publisher-gui
      - name: Build and relocate descriptions and MoveIt packages
        shell: bash
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          task_ws=${RUNNER_TEMP}/description_moveit_ws
          mkdir -p "${task_ws}/src/urdf" "${task_ws}/src/moveit"
          cp -a urdf/. "${task_ws}/src/urdf/"
          cp -a moveit/. "${task_ws}/src/moveit/"
          cd "${task_ws}"
          colcon build --merge-install --event-handlers console_cohesion+
          mv src source_hidden
          mv build build_hidden
          mv install relocated_install
      - name: Plan and execute every tool configuration, check IK, limits and collisions
        shell: bash
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source ${RUNNER_TEMP}/description_moveit_ws/relocated_install/setup.bash
          xvfb-run -a -s '-screen 0 1600x1100x24' \
            python3 tools/moveit_support/validate_moveit2.py --output reports/integration/moveit2/${ROS_DISTRO}
      - name: Save MoveIt checks and RViz screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moveit2-${{ matrix.distro }}-validation
          path: reports/integration/moveit2/${{ matrix.distro }}/
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [standalone, ros2, moveit2]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: robot-description-packages
          path: dist
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/par6_mujoco.zip dist/par6_urdf.zip \
            dist/parol6_mujoco.zip dist/parol6_urdf.zip \
            dist/msg_mujoco.zip dist/msg_urdf.zip \
            dist/ssg48_mujoco.zip dist/ssg48_urdf.zip \
            dist/par6_moveit_config.zip dist/parol6_moveit_config.zip \
            dist/robot_kinematics_review.pdf dist/release_manifest.json dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Robot descriptions $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
