name: Build and release description packages

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-build.lock.txt
      - name: Native CAD and SVG dependencies
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libcairo2 libegl1
      - name: Install locked build environment
        run: python -m pip install -r requirements-build.lock.txt
      - name: Portable reference regression tests
        run: python -I -m pytest tests -q -p no:cacheprovider
      - name: Full independent build and validation
        run: python -I tools/build.py
      - name: Save portability diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-portability-diagnostics
          path: |
            mujoco/par6/assets/branding
            mujoco/par6/par6_flange.xml
            source/reviews/render_cache/par6_flange.json
            tools/side_badge_geometry.json
      - name: Prepare checked release assets
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python -I tools/prepare_release.py --tag "$GITHUB_REF_NAME"
          else
            python -I tools/prepare_release.py
          fi
      - name: Save model packages
        uses: actions/upload-artifact@v7
        with:
          name: robot-description-packages
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: standalone
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: robot-description-packages
          path: dist
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/par6_mujoco.zip dist/par6_urdf.zip \
            dist/parol6_mujoco.zip dist/parol6_urdf.zip \
            dist/robot_kinematics_review.pdf dist/release_manifest.json dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Robot descriptions $GITHUB_REF_NAME" \
            --notes-file "releases/$GITHUB_REF_NAME.md"
